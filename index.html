<!DOCTYPE HTML>
<html lang="it">
	<head>
		<title>Chiara Gadotti</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<meta name="description" content="Chiara Gadotti - Psicosintesi Educativa e Counseling." />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload">

		<div id="wrapper">

			<header id="header">
				<div class="logo">
					<span class="icon solid fa-seedling"></span>
				</div>
				<div class="content">
					<div class="inner">
						<h1>CHIARA GADOTTI</h1>
						<p style="font-size: 0.9rem; margin-bottom: 1rem; letter-spacing: 0.15rem;">PSICOSINTESI EDUCATIVA E COUNSELING</p>
						<p style="font-weight: 600; color: #f4c430;">SITO IN COSTRUZIONE</p>
					</div>
				</div>
				<nav>
					<ul>
						<li><a href="#contact">Scrivimi</a></li>
					</ul>
				</nav>
			</header>

			<div id="main">
				<article id="contact">
						<h2 class="major">Scrivimi</h2>
						<form method="POST" action="https://formspree.io/f/xvggpzee">
							<div class="fields">
								<div class="field half">
									<label for="name">Nome</label>
									<input type="text" name="name" id="name" required />
								</div>
								<div class="field half">
									<label for="email">Email</label>
									<input type="email" name="email" id="email" required />
								</div>
								<div class="field">
									<label for="message">Messaggio</label>
									<textarea name="message" id="message" rows="4" required></textarea>
								</div>
							</div>
							<ul class="actions">
								<li><input type="submit" value="Invia Messaggio" class="primary" /></li>
								<li><input type="reset" value="Svuota" /></li>
							</ul>
						</form>
					</article>
			</div>

			<footer id="footer">
				<p class="copyright">&copy; Chiara Gadotti</p>
			</footer>

		</div>

		<div id="bg"></div>
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>

	</body>
</html>
